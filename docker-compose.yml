version: '3.8'

services:
  # Redis Cache/Queue
  redis:
    image: redis:7-alpine
    container_name: supply-bill-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - supply-bill-network

  # Main FastAPI Application..
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    container_name: supply-bill-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Use environment variables from .env file
      MONGODB_URL: ${MONGODB_URL}
      DB_NAME: ${DB_NAME}
      
      # Redis Configuration (local container)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      # API Configuration
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DEBUG: ${DEBUG:-true}
      
      # Security
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      
      # CORS Origins
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:8080,https://ops.morsebiz.com}
      
      # AI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
      
      # Processing Configuration
      WORKER_PROCESSES: ${WORKER_PROCESSES:-4}
      MAX_UPLOAD_SIZE: 104857600  # 100MB
      MAX_FILES_PER_BATCH: 20
      JOB_TIMEOUT: 3600
      
      # Validation Settings
      VALIDATION_TOLERANCE_PERCENT: ${VALIDATION_TOLERANCE_PERCENT:-0.5}
      VALIDATION_TOLERANCE_ABSOLUTE: ${VALIDATION_TOLERANCE_ABSOLUTE:-10.0}
      
      # Debugging
      LITELLM_LOG: ${LITELLM_LOG:-true}
    volumes:
      - ./storage:/app/storage
      - ./bills_excel:/app/bills_excel
      - ./bills_pdf:/app/bills_pdf
      - app_temp:/app/temp_uploads
    depends_on:
      - redis
    networks:
      - supply-bill-network

volumes:
  redis_data:
  app_temp:

networks:
  supply-bill-network:
    driver: bridge